[tool.pytest.ini_options]
testpaths = [".claude/tests"]
pythonpath = [".", ".claude"]

[tool.ruff.lint.per-file-ignores]
".claude/tests/**" = ["E402", "F841", "E741"]
# Hook files re-export module surfaces from agents/common/hooks/ so unit tests
# can load them via importlib and access the underlying helpers by attribute.
".claude/hooks/context-cache.py" = ["F401"]
".claude/hooks/listing-guard.py" = ["F401"]
".claude/hooks/truncate-output.py" = ["F401"]
