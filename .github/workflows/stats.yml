name: Stats

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests for savings_log.py and stats.py
  # ---------------------------------------------------------------------------
  stats-unit:
    name: "Stats unit tests / Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install numpy pytest

      - name: Run stats unit tests
        run: pytest .claude/tests/unit/test_stats.py -v

  # The end-to-end savings-report flow (seed events → stats.py --report → assert
  # on the rendered report) now lives in .claude/tests/integration/test_stats_report.py
  # and runs in the tests.yml matrix, replacing the old synthetic "stats-report" job.
