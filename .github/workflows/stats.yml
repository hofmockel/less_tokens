name: Stats

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests for savings_log.py and stats.py
  # ---------------------------------------------------------------------------
  stats-unit:
    name: "Stats unit tests / Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install numpy pytest

      - name: Run stats unit tests
        run: pytest tests/unit/test_stats.py -v

  # ---------------------------------------------------------------------------
  # Enable tracking, generate synthetic events, produce a savings report
  # ---------------------------------------------------------------------------
  stats-report:
    name: "Generate savings report"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy

      - name: Enable token tracking
        run: python tools/stats.py --enable

      - name: Generate synthetic savings events
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "tools")
          from savings_log import append
          # Simulate a realistic session
          append({"strategy": "truncation", "tool": "Bash",   "original_chars": 14200, "saved_chars": 10200})
          append({"strategy": "truncation", "tool": "Read",   "original_chars":  9800, "saved_chars":  5800})
          append({"strategy": "truncation", "tool": "Bash",   "original_chars":  6100, "saved_chars":  2100})
          append({"strategy": "search-blocked", "file": "tools/embeddings.py", "saved_chars": 18400})
          append({"strategy": "search-blocked", "file": "tools/search.py",     "saved_chars":  4200})
          append({"strategy": "search", "query": "chunk python AST", "chunk_chars": 1400, "full_file_chars": 18400, "saved_chars": 17000})
          append({"strategy": "search", "query": "cosine similarity", "chunk_chars":  900, "full_file_chars":  4200, "saved_chars":  3300})
          append({"strategy": "compaction", "transcript_chars": 620000, "saved_chars": 0})
          print("Logged 8 synthetic events.")
          EOF

      - name: Show session stats
        run: python tools/stats.py

      - name: Generate savings report
        run: python tools/stats.py --report

      - name: Show report contents
        run: cat .claude/state/savings-report.md

      - name: Upload savings report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: savings-report-${{ github.run_id }}
          path: .claude/state/savings-report.md

      - name: Reset tracking to default-off
        if: always()
        run: python tools/stats.py --disable
