name: Docs Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build docs
        env:
          LESS_TOKENS_DOCS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          LESS_TOKENS_DOCS_COMMIT: ${{ github.sha }}
        run: python3 docs-site/scripts/build_docs.py

      - name: Check docs
        env:
          LESS_TOKENS_DOCS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          LESS_TOKENS_DOCS_COMMIT: ${{ github.sha }}
        run: python3 docs-site/scripts/check_docs.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
