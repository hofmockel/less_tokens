name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Unit + integration: no fastembed, all 3 Python versions × 3 OS
  # ---------------------------------------------------------------------------
  test:
    name: "Test / Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install numpy pytest pyyaml

      - name: Refresh this repo's own dogfooded Codex hook install
        run: python install.py --self-refresh --agent codex --skip-deps --create-venv --no-build

      - name: Run unit tests
        run: pytest .claude/tests/unit/ -v

      - name: Run integration tests
        run: pytest .claude/tests/integration/ -v

  # ---------------------------------------------------------------------------
  # Merge gate: code-changing PRs must record a CHANGELOG [Unreleased] entry
  # ---------------------------------------------------------------------------
  changelog-gate:
    name: "Changelog gate"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check CHANGELOG [Unreleased] for code changes
        run: python .claude/tools/changelog_gate.py

  # ---------------------------------------------------------------------------
  # Merge gate: README savings claims must be registry-backed or marked unverified
  # ---------------------------------------------------------------------------
  label-consistency-gate:
    name: "Label consistency gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh this repo's own dogfooded Codex hook install
        run: python install.py --self-refresh --agent codex --skip-deps --create-venv --no-build

      - name: Check README claims against the savings_log registry
        run: python .claude/tools/label_consistency_gate.py

      - name: Check README strategy table matches strategy_registry
        run: python .claude/tools/strategy_table_docs.py --check

      - name: Check Claude/Codex less-tokens skills match shared template
        run: python .claude/tools/less_tokens_skill_docs.py --check

      - name: Check hook parity documentation matches manifest
        run: python .claude/tools/hook_parity_docs.py --check

      - name: Check Codex enforcement parity (codex_parity_audit)
        run: python .claude/tools/codex_parity_audit.py

      - name: Check for unguarded Windows platform assumptions (WIN1)
        run: python .claude/tools/win_platform_audit.py

      - name: Check installer flags documentation matches install.py argparse
        run: python .claude/tools/installer_flags_docs.py --check

      - name: Check conformance matrix documentation matches evidence store
        run: python .claude/tools/conformance_matrix.py --check

      - name: Check root docs point to their canonical home
        run: python .claude/tools/claudemd_audit.py --docs --strict
