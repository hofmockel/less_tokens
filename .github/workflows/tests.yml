name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Unit + integration: no fastembed, all 3 Python versions × 3 OS
  # ---------------------------------------------------------------------------
  test:
    name: "Test / Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install numpy pytest

      - name: Run unit tests
        run: pytest .claude/tests/unit/ -v

      - name: Run integration tests
        run: pytest .claude/tests/integration/ -v

  # ---------------------------------------------------------------------------
  # Merge gate: code-changing PRs must record a CHANGELOG [Unreleased] entry
  # ---------------------------------------------------------------------------
  changelog-gate:
    name: "Changelog gate"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check CHANGELOG [Unreleased] for code changes
        run: python .claude/tools/changelog_gate.py
