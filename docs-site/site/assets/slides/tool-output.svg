<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="tool-output-title tool-output-desc">
  <title id="tool-output-title">Tool Output Controls concept map</title>
  <desc id="tool-output-desc">Noisy command output is shaped into useful head, tail, and signal.</desc>
  <style>
    .bg{fill:#f7f8fa}.grid{stroke:#d8e0e7;stroke-width:1;opacity:.65}.title{font:700 28px system-ui;fill:#16202a}.caption{font:17px system-ui;fill:#5d6975}.node{fill:#fff;stroke:var(--tone);stroke-width:3}.node-label{font:700 15px system-ui;fill:#16202a}.flow{fill:none;stroke:#788690;stroke-width:3;stroke-linecap:round}.hub{fill:#16202a}.hub-text{font:700 13px system-ui;fill:#fff}.lane{font:700 13px system-ui;fill:#16202a}
  </style>
  <rect class="bg" x="0" y="0" width="980" height="620" rx="0"/>
  <path class="grid" d="M80 112 H900 M80 390 H900 M80 530 H900 M120 80 V540 M860 80 V540"/>
  <text x="60" y="72" class="title">Tool Output Controls</text>
  <text x="60" y="110" class="caption">Noisy command output is shaped into useful head, tail, and signal.</text>
  <circle cx="490" cy="168" r="42" class="hub"/>
  <text x="490" y="164" class="hub-text" text-anchor="middle">TOKEN</text>
  <text x="490" y="182" class="hub-text" text-anchor="middle">CONTROL</text>
  <path d="M240 296 C274 266, 246 326, 280 296" class="flow"/><path d="M470 296 C504 266, 476 326, 510 296" class="flow"/><path d="M700 296 C734 266, 706 326, 740 296" class="flow"/>
  <rect x="60" y="250" width="170" height="92" rx="8" class="node" style="--tone:#2f7d78"/><text x="145" y="300" class="node-label" text-anchor="middle">Command</text><rect x="290" y="250" width="170" height="92" rx="8" class="node" style="--tone:#225f88"/><text x="375" y="300" class="node-label" text-anchor="middle">Parser</text><rect x="520" y="250" width="170" height="92" rx="8" class="node" style="--tone:#9a5b20"/><text x="605" y="300" class="node-label" text-anchor="middle">Head/Tail</text><rect x="750" y="250" width="170" height="92" rx="8" class="node" style="--tone:#4c6f52"/><text x="835" y="300" class="node-label" text-anchor="middle">Concise Signal</text>
  <g><rect x="120" y="462" width="130" height="36" rx="6" fill="#2f7d78" opacity=".14"/><text x="185" y="485" class="lane" text-anchor="middle">input</text></g><g><rect x="300" y="462" width="130" height="36" rx="6" fill="#225f88" opacity=".14"/><text x="365" y="485" class="lane" text-anchor="middle">tool</text></g><g><rect x="480" y="462" width="130" height="36" rx="6" fill="#9a5b20" opacity=".14"/><text x="545" y="485" class="lane" text-anchor="middle">output</text></g><g><rect x="660" y="462" width="130" height="36" rx="6" fill="#4c6f52" opacity=".14"/><text x="725" y="485" class="lane" text-anchor="middle">fixed</text></g>
</svg>
