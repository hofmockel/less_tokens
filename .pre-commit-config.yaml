# Pre-commit hooks for less_tokens contributors.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: label-consistency-gate
        name: measured-vs-asserted README label gate
        entry: python .claude/tools/label_consistency_gate.py
        language: system
        pass_filenames: false
        always_run: true
      - id: strategy-table-docs
        name: README strategy table matches strategy_registry
        entry: python .claude/tools/strategy_table_docs.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: bug-hunt-docs
        name: bug-hunt-protocol.md matches bug_hunt_registry
        entry: python .claude/tools/bug_hunt_docs.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: bugfix-docs
        name: bugfix-protocol.md matches bugfix_registry
        entry: python .claude/tools/bugfix_docs.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: less-tokens-skill-docs
        name: Claude/Codex less-tokens skills match shared template
        entry: python .claude/tools/less_tokens_skill_docs.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: hook-parity-docs
        name: README/DOCUMENTATION hook parity tables match manifest
        entry: python .claude/tools/hook_parity_docs.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: installer-flags-docs
        name: DOCUMENTATION installer flags table matches install.py argparse
        entry: python .claude/tools/installer_flags_docs.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: canonical-home-docs
        name: root docs point to their canonical home, no duplicate sections
        entry: python .claude/tools/claudemd_audit.py --docs --strict
        language: system
        pass_filenames: false
        always_run: true
