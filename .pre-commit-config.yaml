# Pre-commit hooks for less_tokens contributors.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: changelog-gate
        name: backlog-lifecycle gate
        entry: python .claude/tools/changelog_gate.py
        language: system
        pass_filenames: false
        files: ^(CHANGELOG|BACKLOG)\.md$
